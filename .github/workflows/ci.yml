name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install beautifulsoup4 lxml numpy pytest ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest
      - name: Reader syntax
        run: node --check reader/app.js && python -m json.tool .claude/launch.json > /dev/null
