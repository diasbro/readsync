name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"  # the menu app's Python (app/build.sh PY_VERSION): it builds the books
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: pip install beautifulsoup4 lxml numpy pypdf pytest ruff==0.16.9 fonttools brotli
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest
      - name: Reader syntax
        run: for f in reader/*.js; do node --check "$f" || exit 1; done && python -m json.tool .claude/launch.json > /dev/null
