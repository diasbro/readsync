# readsync for iPhone: `xcodegen` turns this into Readsync.xcodeproj (not tracked).
name: Readsync
options:
  bundleIdPrefix: io.github.diasbro
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # the app speaks Russian: system panels (the folder picker), sizes and dates follow it
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${READSYNC_TEAM}
targets:
  Readsync:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      # the reader itself, as the browser serves it: one copy of the code for both
      - path: ../reader
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.diasbro.readsync
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: readsync
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # the app's own folder is visible in Files: books can be put there by hand as well
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        CFBundleLocalizations: [ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # «Открыть в readsync» from Files, Mail, Telegram, Safari: text books become books of the library
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.gribuser.fictionbook
            UTTypeDescription: FictionBook
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [fb2]
              public.mime-type: [application/x-fictionbook+xml]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Книга
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.gribuser.fictionbook
              - org.idpf.epub-container
              - com.adobe.pdf
              - public.plain-text
              - public.zip-archive
  ReadsyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../tests/state_vectors.json
        buildPhase: resources
      - path: ../tests/status_vectors.json
        buildPhase: resources
      # made-up books in every format the phone imports, and what the pipeline makes of them
      - path: ../tests/import_vectors
        type: folder
        buildPhase: resources
    dependencies:
      - target: Readsync
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.diasbro.readsync.tests
schemes:
  Readsync:
    build:
      targets:
        Readsync: all
        ReadsyncTests: [test]
    test:
      targets: [ReadsyncTests]
