[project]
name = "readsync"
version = "0.1.0"
description = "Immersion reading: book text synced with an audiobook, with focus and eye-care tooling"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "beautifulsoup4",
  "lxml",
  "numpy",
  "soundfile",
  "ctc-forced-aligner==1.0.2",
  "onnxruntime",
  "unidecode",
  "faster-whisper",
  "pypdf",
]

# the repository is scripts plus a static reader, not an importable package: install only the dependencies
[tool.setuptools]
packages = []
py-modules = []

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.6", "fonttools", "brotli"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "books"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]  # the tests import serve-side modules (sources/) from the repository root
